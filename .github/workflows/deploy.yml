name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Type-check and build
        run: npm run build
        env:
          # pinned: Pages reports http:// until "Enforce HTTPS" is on, and canonical URLs must be https
          SITE: https://abdul-hadi.me
          BASE: /
          PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Budget check (build output; browsers only fetch the fonts in use)
        run: |
          size=$(du -sk dist | cut -f1)
          echo "dist is ${size} KB"
          test "$size" -lt 6144

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
